# ---------------------------------------------------------------------------
# Minimal single-node Airflow stack (LocalExecutor + Postgres metadata DB)
# for running/testing this pipeline locally. Not intended for production
# deployment as-is -- production should use a managed Airflow (MWAA,
# Astronomer, Composer) or a properly HA Helm deployment.
# ---------------------------------------------------------------------------
version: "3.8"

x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:-}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Pipeline-specific env vars, sourced from .env at compose runtime
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
    S3_BUCKET_NAME: "${S3_BUCKET_NAME}"
    S3_SOURCE_KEY: "${S3_SOURCE_KEY}"
    SNOWFLAKE_ACCOUNT: "${SNOWFLAKE_ACCOUNT}"
    SNOWFLAKE_USER: "${SNOWFLAKE_USER}"
    SNOWFLAKE_PASSWORD: "${SNOWFLAKE_PASSWORD}"
    SNOWFLAKE_ROLE: "${SNOWFLAKE_ROLE}"
    SNOWFLAKE_WAREHOUSE: "${SNOWFLAKE_WAREHOUSE}"
    SNOWFLAKE_DATABASE: "${SNOWFLAKE_DATABASE}"
    SNOWFLAKE_RAW_SCHEMA: "${SNOWFLAKE_RAW_SCHEMA}"
    SNOWFLAKE_SCHEMA: "${SNOWFLAKE_SCHEMA}"
    SNOWFLAKE_STAGE: "${SNOWFLAKE_STAGE}"
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/scripts
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  postgres-db-volume:
