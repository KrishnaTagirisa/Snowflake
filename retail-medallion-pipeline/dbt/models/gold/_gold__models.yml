version: 2

models:
  - name: dim_customer
    description: SCD2 customer dimension. Join on customer_sk; filter is_current for latest view.
    columns:
      - name: customer_sk
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_product
    description: SCD1 product dimension.
    columns:
      - name: product_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension with UK fiscal year (April start).
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fct_order_lines
    description: Order line fact. Grain = one row per order line.
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: customer_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
      - name: product_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk
      - name: order_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: net_amount
        data_tests: [not_null]

  - name: agg_daily_sales
    description: Daily sales by category, channel and currency (excludes cancelled/returned).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_date_key, category, sales_channel, currency]
