version: 2

models:
  - name: stg_customers
    description: Cleansed customers, one row per customer (latest version).
    columns:
      - name: customer_id
        description: Business key from the OMS.
        data_tests: [unique, not_null]
      - name: email
        data_tests:
          - not_null:
              config: { severity: warn }
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONSUMER', 'CORPORATE', 'SMALL_BUSINESS', 'UNKNOWN']
      - name: updated_at
        data_tests: [not_null]

  - name: stg_products
    description: Cleansed products, one row per product (SCD1).
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: unit_price
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: stg_orders
    description: Order headers, one row per order (latest status).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
              config: { severity: warn }   # orders can arrive before the customer file
      - name: order_ts
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['PLACED', 'PAID', 'SHIPPED', 'DELIVERED', 'CANCELLED', 'RETURNED', 'UNKNOWN']

  - name: stg_order_items
    description: Order lines flattened from the orders JSON items[] array.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_amount = round(quantity * unit_price - discount_amount, 2)"
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
              config: { severity: warn }
      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
